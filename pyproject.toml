[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keycast-overlay-windows"
version = "0.1.0"
description = "Translucent, click-through Windows overlay showing your recent keystrokes, newest ones highlighted in gold"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Kemal Codes", email = "74741855+techkayacodes@users.noreply.github.com" },
]
keywords = ["windows", "keycast", "overlay", "keyboard", "screencast", "streaming", "showmethekey"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]

[project.scripts]
keycast-overlay = "keycast_overlay.cli:main"

[project.gui-scripts]
keycast-overlayw = "keycast_overlay.cli:main"

[tool.setuptools.packages.find]
include = ["keycast_overlay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
